  <text x="1460" y="118" text-anchor="end" fill="#8B5E34" font-family="Segoe UI, Arial, sans-serif" font-size="24">Theme preview cover</text>
  <rect x="88" y="186" width="640" height="618" rx="36" fill="#3E2E28" fill-opacity="0.95"/>
  <text x="136" y="256" fill="#F0C7A6" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">WHOLESALE / RETAIL / UNIFORM / OEM</text>
  <text x="136" y="344" fill="#FFF8F1" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="800">Atelier-commerce cho xưởng may.</text>
  <text x="136" y="438" fill="#EAD8CC" font-family="Segoe UI, Arial, sans-serif" font-size="34">Thiết kế lại từ nền marketplace sang visual ấm, có chiều sâu vật liệu và nhịp content dành cho line sản xuất thời trang.</text>
  <rect x="136" y="534" width="220" height="66" rx="33" fill="#FFF8F1"/>
  <text x="246" y="577" text-anchor="middle" fill="#7F3A25" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">Hero lookbook</text>
  <rect x="378" y="534" width="232" height="66" rx="33" fill="#A35035"/>
  <text x="494" y="577" text-anchor="middle" fill="#FFF8F1" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">Catalog atelier</text>
  <rect x="780" y="202" width="732" height="278" rx="36" fill="#FFF8F1" stroke="#D9B8A2"/>
  <text x="832" y="270" fill="#7F3A25" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="800">Điểm khác biệt</text>
  <text x="832" y="338" fill="#8B5E34" font-family="Segoe UI, Arial, sans-serif" font-size="28">• Home dùng section line sản phẩm, capacity và service lane</text>
  <text x="832" y="388" fill="#8B5E34" font-family="Segoe UI, Arial, sans-serif" font-size="28">• Product, category, search theo phong cách studio / workshop</text>
  <text x="832" y="438" fill="#8B5E34" font-family="Segoe UI, Arial, sans-serif" font-size="28">• Demo preset may mặc sinh menu, banner, taxonomy và nội dung đúng ngành</text>
  <rect x="780" y="522" width="732" height="282" rx="36" fill="#6E8A62"/>
  <text x="832" y="590" fill="#F7F4EE" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="800">Admin-ready</text>
  <text x="832" y="658" fill="#E8F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="28">Theme block riêng cho hero/footer/company, đồng bộ quick-edit với storefront.</text>
  <text x="832" y="708" fill="#E8F1E4" font-family="Segoe UI, Arial, sans-serif" font-size="28">Generate demo data ngay từ Theme Manager với preset xưởng may quần áo sỉ lẻ.</text>
